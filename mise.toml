[tools]
go = "1.27.0"
node = "24.18.0"
sqlc = "1.31.1"
gh = "2.100.0"
"github:seaweedfs/seaweedfs" = "4.45"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
"go:github.com/wailsapp/wails/v3/cmd/wails3" = "v3.0.0-beta.14"
"go:github.com/pressly/goose/v3/cmd/goose" = "v3.28.0"

[env]
_.path = [
    "C:/Program Files (x86)/NSIS",
]

[bootstrap.packages]
"winget:NSIS.NSIS" = { os = "windows" }


[tasks.test]
description = "运行所有 TEST"
run = "go test ./..."

[tasks.gen-sqlc]
description = "生成 sqlc 代码"
run = "sqlc generate -f db/sqlc.yml"

[tasks.build-seaweedfs]
description = "根据当前系统构建 Darwin Manager"
run = "go run ./cmd/build-seaweedfs"

[tasks.fmt]
description = "格式化代码"
run = [
    "go fmt ./...",
    "npm --prefix ./web run format"
]

[tasks.dev]
description = "开发 APP"
run = "wails3 dev"


[tasks.package]
description = "打包 Wails APP"
run = "wails3 package"

[tasks.update]
description = "更新 Wails APP"
run = "wails3 task common:update:build-assets"
