[tools]
go = "1.27.0"
node = "24.18.0"
npm = "latest"
sqlc = "1.31.1"

[env]
ENVIRONMENT = "prod"
MACOSX_DEPLOYMENT_TARGET="13.0"
CGO_CFLAGS="-mmacosx-version-min=13.0"
CGO_CXXFLAGS="-mmacosx-version-min=13.0"
CGO_LDFLAGS="-mmacosx-version-min=13.0"

[tasks.dev-app]
description = "开发 APP"
run = "go run ./cmd/app"
env = { ENVIRONMENT = "dev" }
raw = true

[tasks.dev-api]
description = "开发 API"
run = "go run ./cmd/api"
env = {
    ENVIRONMENT = "dev",
    NAME = "evo",
    VERSION = "0.0.1",
    DSN = "file:./tmp/data.sqlite"
}
raw = true

[tasks.build-api]
description = "构建 API"
run = "go build -trimpath -ldflags='-s -w' -o ./tmp ./cmd/api"
env = {
    CGO_ENABLED = 0,
}
raw = true

[tasks.build-web]
description = "构建 WEB"
dir = "web"
run = "npm run build"

[tasks.test]
description = "运行所有 TEST"
run = "go test ./..."

