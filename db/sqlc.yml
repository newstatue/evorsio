version: "2"

sql:
  - engine: "sqlite"
    schema: "tables"
    queries: "queries"
    gen:
      go:
        package: "dbgen"
        out: "../internal/dbgen"
        sql_package: "database/sql"
        emit_json_tags: false
        emit_empty_slices: true
        emit_interface: false
        emit_prepared_queries: false
        overrides:
          - db_type: "DATETIME"
            go_type:
              import: "time"
              type: "Time"