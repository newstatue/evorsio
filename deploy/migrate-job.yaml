apiVersion: batch/v1
kind: Job
metadata:
  name: evorsio-migrate
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/newstatue/evorsio:latest
          command:
            - bun
            - run
            - db:migrate
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: evorsio-secret
                  key: DATABASE_URL
