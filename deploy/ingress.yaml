apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: evorsio
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: evorsio.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: evorsio
                port:
                  number: 80